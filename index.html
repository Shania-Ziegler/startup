<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Learn how quantum computer hardware works through interactive puzzles." />
  <title>Quantum Sanctuary</title>
</head>

<body>

  <header>
    <h1>Quantum Sanctuary</h1>
    <p>Player: <span id="player-name">Guest</span></p>
    <nav>
      <ul>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
    <hr />
  </header>

  <main>
    <section>
      <h2>Login</h2>
      <!-- Placeholder login. Becomes a POST to the auth endpoint in the Service deliverable. -->
      <form method="get" action="map.html">
        <div>
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" placeholder="Username" required />
        </div>
        <div>
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Password" required />
        </div>
        <div>
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember">Remember me</label>
        </div>
        <button type="submit">Login</button>
        <button type="button">New Player? Register</button>
      </form>
    </section>
  </main>

  <footer>
    <hr />
    <p>Shania Ziegler</p>
    <p><a href="https://github.com/Shania-Ziegler/startup" target="_blank" rel="noopener noreferrer">GitHub</a></p>
  </footer>

</body>

</html>
